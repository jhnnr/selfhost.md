site_name: selfhost.md
site_description: Homelab Infrastructure & Selfhosting Documentation
site_author: jhnnr
site_url: https://jhnnr.github.io/selfhost.md/
repo_name: jhnnr/selfhost.md
repo_url: https://github.com/jhnnr/selfhost.md

theme:
  name: mkdocs
  highlightjs: true
  hljs_languages:
    - yaml
    - bash
    - python
    - sql
    - json
    - ini

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Architecture:
    - Infrastructure Map: infrastructure-map.md
    - Inventory & Registry: inventory.md
    - Storage Pipeline: storage/architecture.md
  - Network:
    - Topology & Subnets: network/topology.md
  - Compute & Nodes:
    - Proxmox Host (pve01): nodes/pve01.md
    - qBittorrent (CT 105): containers/ct105-qbit.md
  - Automation & Scripts:
    - Discord Notification Hook: scripts/discord-notification.md
    - qBittorrent Relocate Hook: scripts/qbit-relocate.md
